image:
  registry: docker.io
  repository: greptime/greptimedb
  tag: "<IMAGE_TAG>"

frontend:
  replicas: 3
  configData: |
    # Write retries can duplicate rows in append-only tables (traces, logs).
    [write_retry]
    max_retries = 0
  service:
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"

meta:
  replicas: 3
  configData: |
    backend_tls.mode = "require"
    meta_schema_name = "greptime_schema_prod"
  backendStorage:
    postgresql:
      host: "<AURORA_HOST>"
      port: 5432
      database: "<AURORA_DATABASE>"
      table: "greptime_metakv"
      electionLockID: 42
      credentials:
        existingSecretName: "meta-postgresql-credentials"

datanode:
  replicas: 3
  configData: |
    [[region_engine]]
    [region_engine.mito]
    # Cap memory explicitly: the defaults derive from node memory, not the pod limit.
    global_write_buffer_size = "512MB"
    global_write_buffer_reject_size = "1GB"
    page_cache_size = "512MB"
    experimental_compaction_memory_limit = "500MB"
    experimental_compaction_on_exhausted = "fail"
  podTemplate:
    serviceAccount:
      create: true
      annotations:
        eks.amazonaws.com/role-arn: "<GREPTIME_S3_ROLE_ARN>"
  storage:
    storageClassName: gp3

objectStorage:
  s3:
    bucket: "<S3_BUCKET>"
    region: "<AWS_REGION>"
    root: "<S3_PREFIX>"
    endpoint: "s3.<AWS_REGION>.amazonaws.com"
    enableVirtualHostStyle: true

dedicatedWAL:
  enabled: true
  raftEngine:
    fs:
      storageClassName: gp3
      storageSize: 50Gi
