name: Cleanup Preview

on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    name: Remove Preview Deployment
    if: contains(github.event.pull_request.labels.*.name, 'preview deploy')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Remove preview environment
        run: |
          STAGE="pr-${{ github.event.pull_request.number }}"
          if ! bun run sst state list | grep -q "${STAGE}"; then
            echo "Stage $STAGE does not exist, skipping cleanup"
            exit 0
          fi
          echo "Removing preview environment: $STAGE"
          bun run sst remove --stage $STAGE
